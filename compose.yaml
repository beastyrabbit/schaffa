services:
  mumpitz:
    image: git.heerlab.com/beasty/mumpitz:latest
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MUMPITZ_APP_BASE_URL: ${MUMPITZ_APP_BASE_URL:?set MUMPITZ_APP_BASE_URL}
      MUMPITZ_API_BASE_URL: ${MUMPITZ_API_BASE_URL:?set MUMPITZ_API_BASE_URL}
      MUMPITZ_PUBLIC_BASE_URL: ${MUMPITZ_PUBLIC_BASE_URL:?set MUMPITZ_PUBLIC_BASE_URL}
      MUMPITZ_TOKEN_PEPPER: ${MUMPITZ_TOKEN_PEPPER:?load from secret manager}
      MUMPITZ_BOOTSTRAP_TOKEN: ${MUMPITZ_BOOTSTRAP_TOKEN:?load from secret manager}
      MUMPITZ_DATA_DIR: /data
      MAX_PAGE_BYTES: ${MAX_PAGE_BYTES:-2097152}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-268435456}
      IMAGE_MAX_INPUT_PIXELS: ${IMAGE_MAX_INPUT_PIXELS:-40000000}
      IMAGE_MAX_EDGE: ${IMAGE_MAX_EDGE:-2560}
      IMAGE_WEBP_QUALITY: ${IMAGE_WEBP_QUALITY:-82}
      MAX_PUBLISHED_IMAGE_BYTES: ${MAX_PUBLISHED_IMAGE_BYTES:-8388608}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - mumpitz-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mumpitz-data:
