services:
  schaffa:
    image: ${SCHAFFA_IMAGE:?set an immutable ghcr.io/beastyrabbit/schaffa@sha256 reference}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      SCHAFFA_BASE_URL: ${SCHAFFA_BASE_URL:?set SCHAFFA_BASE_URL}
      SCHAFFA_TOKEN_PEPPER: ${SCHAFFA_TOKEN_PEPPER:?load from secret manager}
      SCHAFFA_BOOTSTRAP_TOKEN: ${SCHAFFA_BOOTSTRAP_TOKEN:-}
      SCHAFFA_DATA_DIR: /data
      SHOO_BASE_URL: ${SHOO_BASE_URL:-https://shoo.dev}
      SHOO_ISSUER: ${SHOO_ISSUER:-https://shoo.dev}
      USER_SESSION_TTL_HOURS: ${USER_SESSION_TTL_HOURS:-168}
      CLAMGATE_BASE_URL: ${CLAMGATE_BASE_URL:-https://virus.heerlab.com}
      CLAMGATE_PUBLIC_KEY_FILE: /run/clamgate/public.pem
      CLAMGATE_PUBLIC_KEY_ID: ${CLAMGATE_PUBLIC_KEY_ID:?set the trusted key ID}
      CLAMGATE_APPLICATION_TOKEN: ${CLAMGATE_APPLICATION_TOKEN:-}
      CLAMGATE_GUIDE_TIMEOUT_MS: ${CLAMGATE_GUIDE_TIMEOUT_MS:-120000}
      CLAMGATE_TIMEOUT_MS: ${CLAMGATE_TIMEOUT_MS:-3600000}
      ANONYMOUS_PAGE_TTL_SECONDS: ${ANONYMOUS_PAGE_TTL_SECONDS:-3600}
      ANONYMOUS_PAGE_RETENTION_DAYS: ${ANONYMOUS_PAGE_RETENTION_DAYS:-30}
      ANONYMOUS_UPLOADS_PER_HOUR: ${ANONYMOUS_UPLOADS_PER_HOUR:-20}
      AUTHENTICATED_UPLOADS_PER_HOUR: ${AUTHENTICATED_UPLOADS_PER_HOUR:-120}
      USER_LOGINS_PER_HOUR: ${USER_LOGINS_PER_HOUR:-60}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MAX_PAGE_BYTES: ${MAX_PAGE_BYTES:-2097152}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-268435456}
      MAX_IMAGE_INPUT_BYTES: ${MAX_IMAGE_INPUT_BYTES:-33554432}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-21474836480}
      MAX_ANONYMOUS_STORAGE_BYTES: ${MAX_ANONYMOUS_STORAGE_BYTES:-536870912}
      MAX_ANONYMOUS_PAGES: ${MAX_ANONYMOUS_PAGES:-5000}
      MAX_PAGE_VERSIONS: ${MAX_PAGE_VERSIONS:-25}
      MAX_GUIDE_STEPS: ${MAX_GUIDE_STEPS:-1000}
      MAX_GUIDE_REVISIONS: ${MAX_GUIDE_REVISIONS:-1000}
      MAX_GUIDE_METADATA_BYTES: ${MAX_GUIDE_METADATA_BYTES:-67108864}
      IMAGE_MAX_INPUT_PIXELS: ${IMAGE_MAX_INPUT_PIXELS:-40000000}
      IMAGE_MAX_EDGE: ${IMAGE_MAX_EDGE:-2560}
      IMAGE_WEBP_QUALITY: ${IMAGE_WEBP_QUALITY:-82}
      IMAGE_CLEAN_CONCURRENCY: ${IMAGE_CLEAN_CONCURRENCY:-2}
      MAX_PUBLISHED_IMAGE_BYTES: ${MAX_PUBLISHED_IMAGE_BYTES:-8388608}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - schaffa-data:/data
      - type: bind
        source: ${CLAMGATE_PUBLIC_KEY_FILE:?set the trusted public key path on the host}
        target: /run/clamgate/public.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  schaffa-data:
