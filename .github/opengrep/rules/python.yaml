# SPDX-License-Identifier: MIT
rules:
  - id: homelab.python.eval
    languages: [python]
    severity: WARNING
    message: Review dynamic code evaluation.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
  - id: homelab.python.shell
    languages: [python]
    severity: WARNING
    message: Review subprocess invocation through a shell.
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
  - id: homelab.python.tls-verification-disabled
    languages: [python]
    severity: WARNING
    message: TLS certificate verification is disabled.
    pattern: requests.$METHOD(..., verify=False, ...)
