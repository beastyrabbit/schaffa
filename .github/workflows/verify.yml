name: Verify supported runtimes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.0.0
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - name: Broad type-aware static analysis (advisory)
        if: runner.os == 'Linux'
        env:
          STATIC_REPORT_PATH: ${{ runner.temp }}/static-analysis.json
        run: node scripts/opengrep/eslint-report.mjs
      - name: Retain type-aware analysis findings
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: type-aware-static-analysis
          path: ${{ runner.temp }}/static-analysis.json
          if-no-files-found: error
          retention-days: 14
      - run: pnpm audit --prod --audit-level high
      - if: runner.os == 'Linux'
        run: bash scripts/ci-gitleaks.sh
      - name: Pack standalone CLI
        run: pnpm pack:cli "$RUNNER_TEMP/package"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install and smoke test the CLI at its minimum runtime
        run: bash scripts/ci-check-cli.sh "$RUNNER_TEMP"/package/*.tgz
