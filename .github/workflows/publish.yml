name: Publish release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  sourcemaps:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and inject deterministic debug IDs
        run: pnpm build:server && pnpm exec sentry-cli sourcemaps inject dist
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Verify debug IDs against the published image
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          image_dist="$(mktemp -d)"
          container=""
          trap 'if [ -n "$container" ]; then docker rm -v "$container"; fi; rm -rf "$image_dist"' EXIT
          docker pull "$RELEASE_IMAGE"
          container="$(docker create "$RELEASE_IMAGE")"
          docker cp "$container:/app/dist/." "$image_dist/"
          bash scripts/ci-check-debug-ids.sh dist "$image_dist"
      - name: Upload server maps and finalize release
        env:
          SENTRY_URL: https://glitchtip.heerlab.com
          SENTRY_ORG: beasty-rabbit
          SENTRY_PROJECT: schaffa
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: |
          export SENTRY_RELEASE="schaffa@$(node -p 'require("./package.json").version')"
          pnpm exec sentry-cli releases new "$SENTRY_RELEASE"
          pnpm exec sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" dist
          pnpm exec sentry-cli releases finalize "$SENTRY_RELEASE"

  deploy-smoke:
    needs: publish
    # Flux image automation only rolls out stable releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Wait for the release on schaffa.dev and check public endpoints
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          SMOKE_BASE_URL: https://schaffa.dev
        run: node scripts/ci-smoke-deploy.mjs

  arc-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: arc-schaffa
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install video test encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Run type, lint, test, and build checks
        run: pnpm typecheck && pnpm lint && pnpm test && pnpm build

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Ensure the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require passing main CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-require-green-main.mjs

      - name: Validate release version
        run: RELEASE_REF_NAME="$GITHUB_REF_NAME" RELEASE_ENV_FILE="$GITHUB_ENV" node scripts/ci-validate-release.mjs

      - name: Ensure this version is not already published
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          set +e
          published_version="$(npm view "schaffa@${RELEASE_VERSION}" version 2>"$error_file")"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            if [[ "$published_version" != "$RELEASE_VERSION" ]]; then
              echo "npm returned unexpected version '$published_version' for schaffa@${RELEASE_VERSION}." >&2
              exit 1
            fi
            echo "schaffa@${RELEASE_VERSION} is already published; skipping the immutable package."
            echo "PUBLISH_NPM=false" >> "$GITHUB_ENV"
          elif grep -Eq '(^|[[:space:]])E404([[:space:]]|$)' "$error_file"; then
            echo "PUBLISH_NPM=true" >> "$GITHUB_ENV"
          else
            cat "$error_file" >&2
            exit "$status"
          fi

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan committed content for secrets
        run: bash scripts/ci-gitleaks.sh

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build and verify CLI artifact
        run: |
          pnpm pack:cli "$RUNNER_TEMP/package"
          bash scripts/ci-check-cli.sh "$RUNNER_TEMP"/package/*.tgz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build candidate image by digest
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

      - name: Scan candidate and promote its digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          export IMAGE_TAGS="ghcr.io/$GITHUB_REPOSITORY:$RELEASE_VERSION
          ghcr.io/$GITHUB_REPOSITORY:sha-$GITHUB_SHA"
          if [ "$RELEASE_PRERELEASE" = false ]; then
            IMAGE_TAGS="$IMAGE_TAGS
          ghcr.io/$GITHUB_REPOSITORY:latest"
          fi
          bash scripts/ci-promote-image.sh "ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST"
          printf 'ghcr.io/%s@%s\n' "$GITHUB_REPOSITORY" "$IMAGE_DIGEST" > "$RUNNER_TEMP/package/container-digest.txt"

      - name: Publish CLI with npm Trusted Publishing
        if: env.PUBLISH_NPM != 'false'
        run: |
          pnpm publish "$RUNNER_TEMP"/package/*.tgz --no-git-checks --access public --tag "$RELEASE_DIST_TAG"

      - name: Attach verified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/package"
          sha256sum "schaffa-$RELEASE_VERSION.tgz" > "schaffa-$RELEASE_VERSION.tgz.sha256"
          gh release upload "$RELEASE_TAG" "schaffa-$RELEASE_VERSION.tgz" \
            "schaffa-$RELEASE_VERSION.tgz.sha256" container-digest.txt --repo "$GITHUB_REPOSITORY"
