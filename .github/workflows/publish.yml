name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Ensure the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release version
        run: RELEASE_REF_NAME="$GITHUB_REF_NAME" RELEASE_ENV_FILE="$GITHUB_ENV" node scripts/ci-validate-release.mjs

      - name: Ensure this version is not already published
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          set +e
          published_version="$(npm view "schaffa@${RELEASE_VERSION}" version 2>"$error_file")"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            if [[ "$published_version" != "$RELEASE_VERSION" ]]; then
              echo "npm returned unexpected version '$published_version' for schaffa@${RELEASE_VERSION}." >&2
              exit 1
            fi
            echo "schaffa@${RELEASE_VERSION} is already published; skipping the immutable package."
            echo "PUBLISH_NPM=false" >> "$GITHUB_ENV"
          elif grep -Eq '(^|[[:space:]])E404([[:space:]]|$)' "$error_file"; then
            echo "PUBLISH_NPM=true" >> "$GITHUB_ENV"
          else
            cat "$error_file" >&2
            exit "$status"
          fi

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type, lint, and test checks
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Publish CLI with npm Trusted Publishing
        if: env.PUBLISH_NPM != 'false'
        run: pnpm --filter schaffa publish --no-git-checks --access public --tag "$RELEASE_DIST_TAG"
