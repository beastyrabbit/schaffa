name: Publish npm package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "packages/cli/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether this version is already published
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./packages/cli/package.json").version')"
          published_version="$(npm view "schaffa@${package_version}" version 2>/dev/null || true)"
          if [[ "$published_version" == "$package_version" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "schaffa@$package_version is already published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test CLI
        if: steps.version.outputs.publish == 'true'
        run: pnpm --filter schaffa test

      - name: Publish CLI with npm Trusted Publishing
        if: steps.version.outputs.publish == 'true'
        run: pnpm --filter schaffa publish --no-git-checks --access public
