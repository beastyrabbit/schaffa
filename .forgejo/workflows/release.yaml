name: Release

on:
  push:
    tags:
      - "v*"

enable-openid-connect: true

permissions:
  contents: write

jobs:
  release:
    runs-on: personal
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate release version
        run: RELEASE_REF_NAME="$FORGEJO_REF_NAME" RELEASE_ENV_FILE="$GITHUB_ENV" node scripts/ci-validate-release.mjs

      - name: Run type, lint, and test checks
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Scan committed content for secrets
        run: bash scripts/ci-gitleaks.sh

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build CLI release artifact
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          pnpm --filter schaffa pack --pack-destination "$release_dir"
          package_file="$(find "$release_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          : "${package_file:?pnpm pack did not create a tarball}"
          package_name="$(basename "$package_file")"
          (
            cd "$release_dir"
            sha256sum "$package_name" > "${package_name}.sha256"
          )
          {
            printf 'PACKAGE_FILE=%s\n' "$package_file"
            printf 'PACKAGE_NAME=%s\n' "$package_name"
          } >> "$GITHUB_ENV"

      - name: Install Docker CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl docker.io jq
          docker --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.forgejo-runners.svc.cluster.local:1234

      - name: Log in to Forgejo package registries
        uses: https://git.heerlab.com/beasty/forgejo-ci/actions/registry-login@c1285eb4d761c067bc09565c079b9f3ba355f137
        with:
          npm-owner: beasty

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: git.heerlab.com/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/ci-trivy.sh "git.heerlab.com/$FORGEJO_REPOSITORY@$IMAGE_DIGEST"

      - name: Publish CLI package
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          set +e
          published_version="$(npm view "schaffa@${RELEASE_VERSION}" version \
            --registry "$FORGEJO_NPM_REGISTRY" 2>"$error_file")"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            if [[ "$published_version" != "$RELEASE_VERSION" ]]; then
              echo "Forgejo returned unexpected version '$published_version' for schaffa@${RELEASE_VERSION}." >&2
              exit 1
            fi
            echo "schaffa@$RELEASE_VERSION is already published; keeping the immutable package."
          elif grep -Eq '(^|[[:space:]])E404([[:space:]]|$)' "$error_file"; then
            pnpm --filter schaffa publish --no-git-checks \
              --registry "$FORGEJO_NPM_REGISTRY" --tag "$RELEASE_DIST_TAG"
          else
            cat "$error_file" >&2
            exit "$status"
          fi

      - name: Create Forgejo release
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          digest_file="$release_dir/container-digest.txt"
          body_file="$RUNNER_TEMP/release-body.md"
          printf 'git.heerlab.com/%s@%s\n' "$FORGEJO_REPOSITORY" "$IMAGE_DIGEST" > "$digest_file"
          printf '%s\n\n%s\n\n- CLI package: `schaffa@%s`\n- Container: `git.heerlab.com/%s:%s`\n- Digest: `%s`\n' \
            "# Schaffa $RELEASE_TAG" \
            "Tagged release with a Forgejo CLI package and immutable container image. npmjs.org publishing runs from the GitHub mirror." \
            "$RELEASE_VERSION" "$FORGEJO_REPOSITORY" "$RELEASE_VERSION" "$IMAGE_DIGEST" > "$body_file"

          release_payload="$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg name "Schaffa $RELEASE_TAG" \
            --arg body "$(<"$body_file")" \
            --argjson prerelease "$RELEASE_PRERELEASE" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: $prerelease}')"

          existing_file="$RUNNER_TEMP/existing-release.json"
          status="$(curl -sS -o "$existing_file" -w '%{http_code}' \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [[ "$status" == "200" ]]; then
            release_id="$(jq -er '.id' "$existing_file")"
            curl -fsS -X PATCH \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$release_payload" \
              "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases/$release_id" >/dev/null
          elif [[ "$status" == "404" ]]; then
            release_id="$(curl -fsS -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$release_payload" \
              "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases" | jq -er '.id')"
          else
            echo "Unexpected Forgejo release lookup status: $status" >&2
            exit 1
          fi

          assets="$(curl -fsS \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases/$release_id/assets")"
          for asset in \
            "$PACKAGE_FILE" \
            "${PACKAGE_FILE}.sha256" \
            "$digest_file"; do
            asset_name="$(basename "$asset")"
            asset_id="$(jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' <<< "$assets")"
            if [[ -n "$asset_id" ]]; then
              curl -fsS -X DELETE \
                -H "Authorization: token $FORGEJO_TOKEN" \
                "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases/$release_id/assets/$asset_id" >/dev/null
            fi
            curl -fsS -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" \
              "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases/$release_id/assets?name=$asset_name" >/dev/null
          done
