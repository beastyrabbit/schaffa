name: Release

on:
  push:
    tags:
      - "v*"

enable-openid-connect: true

permissions:
  contents: write

jobs:
  release:
    runs-on: personal
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate release version
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.FORGEJO_REF_NAME;
          const root = require("./package.json");
          const cli = require("./packages/cli/package.json");
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag || "")) {
            throw new Error(`Release tag ${tag || "<missing>"} is not a supported semantic version.`);
          }
          if (root.version !== cli.version || tag !== `v${cli.version}`) {
            throw new Error(
              `Tag ${tag} must match root and CLI package versions (${root.version}, ${cli.version}).`,
            );
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${cli.version}\nRELEASE_TAG=${tag}\n`);
          NODE

      - name: Run type, lint, and test checks
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Scan committed content for secrets
        run: bash scripts/ci-gitleaks.sh

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build CLI release artifact
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          pnpm --filter schaffa pack --pack-destination "$release_dir"
          package_file="$(find "$release_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          : "${package_file:?pnpm pack did not create a tarball}"
          package_name="$(basename "$package_file")"
          (
            cd "$release_dir"
            sha256sum "$package_name" > "${package_name}.sha256"
          )
          {
            printf 'PACKAGE_FILE=%s\n' "$package_file"
            printf 'PACKAGE_NAME=%s\n' "$package_name"
          } >> "$GITHUB_ENV"

      - name: Install Docker CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl docker.io jq
          docker --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.forgejo-runners.svc.cluster.local:1234

      - name: Log in to Forgejo package registries
        uses: https://git.heerlab.com/beasty/forgejo-ci/actions/registry-login@c1285eb4d761c067bc09565c079b9f3ba355f137
        with:
          npm-owner: beasty

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: git.heerlab.com/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/ci-trivy.sh "git.heerlab.com/$FORGEJO_REPOSITORY@$IMAGE_DIGEST"

      - name: Publish CLI package
        run: |
          set -euo pipefail
          published_version="$(npm view "schaffa@${RELEASE_VERSION}" version \
            --registry "$FORGEJO_NPM_REGISTRY" 2>/dev/null || true)"
          if [[ -n "$published_version" ]]; then
            [[ "$published_version" == "$RELEASE_VERSION" ]]
            echo "schaffa@$RELEASE_VERSION is already published; keeping the immutable package."
          else
            pnpm --filter schaffa publish --no-git-checks --registry "$FORGEJO_NPM_REGISTRY"
          fi

      - name: Fetch npmjs.org publish token from Infisical
        run: |
          set -euo pipefail
          if ! command -v infisical >/dev/null 2>&1; then
            export npm_config_prefix="$RUNNER_TEMP/npm-global"
            mkdir -p "$npm_config_prefix"
            npm install --global @infisical/cli@0.43.91
            echo "$npm_config_prefix/bin" >> "$GITHUB_PATH"
            export PATH="$npm_config_prefix/bin:$PATH"
          fi

          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Missing Forgejo OIDC request token}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Missing Forgejo OIDC request URL}"
          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://git.heerlab.com/beasty")"
          forgejo_jwt="$(node -e 'const fs = require("fs"); const body = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(body.value || "");' <<< "$oidc_response")"
          : "${forgejo_jwt:?Forgejo OIDC response did not include a token}"

          infisical_token="$(infisical login \
            --method oidc-auth \
            --machine-identity-id 3391cc7a-1d47-45b1-914f-027e98c8b3fb \
            --jwt "$forgejo_jwt" \
            --domain http://infisical.auth.svc.cluster.local:8080 \
            --plain --silent)"
          : "${infisical_token:?Infisical OIDC login returned an empty token}"
          echo "::add-mask::$infisical_token"

          npm_token="$(infisical secrets get NPM_TOKEN \
            --domain http://infisical.auth.svc.cluster.local:8080 \
            --token "$infisical_token" \
            --projectId b73713a0-7f0a-48fb-9d0b-360403e18bc2 \
            --env prod \
            --path /ci/npm \
            --plain --silent)"
          : "${npm_token:?Missing NPM_TOKEN in Schaffa /prod/ci/npm}"
          echo "::add-mask::$npm_token"
          {
            echo "NODE_AUTH_TOKEN<<EOF"
            printf '%s\n' "$npm_token"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish CLI package to npmjs.org
        run: |
          set -euo pipefail
          : "${NODE_AUTH_TOKEN:?npmjs.org token was not loaded from Infisical}"
          npmrc_path="$RUNNER_TEMP/npmjs-npmrc"
          umask 077
          {
            echo 'registry=https://registry.npmjs.org/'
            echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}'
          } > "$npmrc_path"
          export NPM_CONFIG_USERCONFIG="$npmrc_path"
          published_version="$(npm view "schaffa@${RELEASE_VERSION}" version \
            --registry https://registry.npmjs.org 2>/dev/null || true)"
          if [[ -n "$published_version" ]]; then
            [[ "$published_version" == "$RELEASE_VERSION" ]]
            echo "schaffa@$RELEASE_VERSION is already published to npmjs.org."
          else
            pnpm --filter schaffa publish \
              --no-git-checks \
              --access public \
              --registry https://registry.npmjs.org
          fi

      - name: Create Forgejo release
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          digest_file="$release_dir/container-digest.txt"
          body_file="$RUNNER_TEMP/release-body.md"
          printf 'git.heerlab.com/%s@%s\n' "$FORGEJO_REPOSITORY" "$IMAGE_DIGEST" > "$digest_file"
          printf '%s\n\n%s\n\n- CLI package: `schaffa@%s`\n- Container: `git.heerlab.com/%s:%s`\n- Digest: `%s`\n' \
            "# Schaffa $RELEASE_TAG" \
            "Tagged release with a public npm CLI package, Forgejo package, and immutable container image." \
            "$RELEASE_VERSION" "$FORGEJO_REPOSITORY" "$RELEASE_VERSION" "$IMAGE_DIGEST" > "$body_file"

          prerelease=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=true
          fi
          release_payload="$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg name "Schaffa $RELEASE_TAG" \
            --arg body "$(<"$body_file")" \
            --argjson prerelease "$prerelease" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: $prerelease}')"

          existing_file="$RUNNER_TEMP/existing-release.json"
          status="$(curl -sS -o "$existing_file" -w '%{http_code}' \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [[ "$status" == "200" ]]; then
            release_id="$(jq -er '.id' "$existing_file")"
            curl -fsS -X PATCH \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$release_payload" \
              "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases/$release_id" >/dev/null
          elif [[ "$status" == "404" ]]; then
            release_id="$(curl -fsS -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$release_payload" \
              "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases" | jq -er '.id')"
          else
            echo "Unexpected Forgejo release lookup status: $status" >&2
            exit 1
          fi

          assets="$(curl -fsS \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases/$release_id/assets")"
          for asset in \
            "$PACKAGE_FILE" \
            "${PACKAGE_FILE}.sha256" \
            "$digest_file"; do
            asset_name="$(basename "$asset")"
            asset_id="$(jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' <<< "$assets")"
            if [[ -n "$asset_id" ]]; then
              curl -fsS -X DELETE \
                -H "Authorization: token $FORGEJO_TOKEN" \
                "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases/$release_id/assets/$asset_id" >/dev/null
            fi
            curl -fsS -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" \
              "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases/$release_id/assets?name=$asset_name" >/dev/null
          done
